# The SQS leg - a worker Deployment with no Service (nothing calls it; it calls out to SQS). No
# bundled SQS here: point QUEUE_URL at a real queue - SQS_ENDPOINT_URL is left UNSET so the AWS SDK
# falls through to its default credential chain, e.g. an IRSA role bound to serviceAccountName below.
# For a credential-free local run against LocalStack instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-sqs-worker
  namespace: k8s-orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-sqs-worker }
  template:
    metadata:
      labels: { app: orders-sqs-worker }
    spec:
      # serviceAccountName: orders-sqs-worker   # bind this to an IRSA role with sqs:ReceiveMessage/
                                                 # DeleteMessage on the queue below
      containers:
        - name: orders-sqs-worker
          image: k8s-orders-sqs-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-in"   # <- replace
