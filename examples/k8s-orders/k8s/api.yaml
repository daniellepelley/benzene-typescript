# The HTTP leg - a normal Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: k8s-orders
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-api }
  template:
    metadata:
      labels: { app: orders-api }
    spec:
      containers:
        - name: orders-api
          image: k8s-orders-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: k8s-orders
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8080 }]
