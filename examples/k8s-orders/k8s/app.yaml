# One Deployment + Service for all three legs - HTTP, SQS, and Kafka all run in this one process
# (see ../src/app.ts). No bundled SQS/Kafka here: point QUEUE_URL and KAFKA_BROKERS at a real queue
# and cluster - SQS_ENDPOINT_URL is left UNSET so the AWS SDK falls through to its default credential
# chain, e.g. an IRSA role bound to serviceAccountName below. For a credential-free local run against
# LocalStack + a throwaway Kafka broker instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-app
  namespace: k8s-orders
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders-app }
  template:
    metadata:
      labels: { app: orders-app }
    spec:
      # serviceAccountName: orders-app   # bind this to an IRSA role with sqs:ReceiveMessage/
                                          # DeleteMessage on the queue below
      containers:
        - name: orders-app
          image: k8s-orders:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - name: QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/orders-in"   # <- replace
            - name: KAFKA_BROKERS
              value: "kafka-bootstrap.kafka.svc.cluster.local:9092"   # <- replace
          readinessProbe:
            # Benzene owns the HTTP listener here (useExpress), so every route is a message handler;
            # a TCP probe checks the listener without inventing a non-domain HTTP route. For an HTTP
            # readiness surface at /benzene/health, wire useBenzeneCloudService (@benzenejs/cloud-service).
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders-app
  namespace: k8s-orders
spec:
  selector: { app: orders-app }
  ports: [{ port: 80, targetPort: 8080 }]
