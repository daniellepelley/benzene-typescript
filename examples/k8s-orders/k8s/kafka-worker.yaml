# The Kafka leg - a worker Deployment with no Service (nothing calls it; it calls out to Kafka). No
# bundled broker here: point KAFKA_BROKERS at a real cluster. For a credential-free local run against
# a throwaway broker instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-kafka-worker
  namespace: k8s-orders
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-kafka-worker }
  template:
    metadata:
      labels: { app: orders-kafka-worker }
    spec:
      containers:
        - name: orders-kafka-worker
          image: k8s-orders-kafka-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BROKERS
              value: "kafka-bootstrap.kafka.svc.cluster.local:9092"   # <- replace
