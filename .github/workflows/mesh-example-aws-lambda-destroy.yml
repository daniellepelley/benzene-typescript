name: Mesh Example AWS Lambda Destroy

# Manual-only teardown for examples/aws-lambda-mesh — the counterpart of "Mesh Example AWS Lambda
# Deploy", and the Node equivalent of .NET's mesh-example-aws-destroy.yml.
#
# WHY THIS EXISTS: the deployed demo costs money while it merely exists. It is not idle — the
# EventBridge schedule invokes the mesh Lambda, which fans spec + healthcheck calls out to every
# service, and the artifact bucket serves the catalog viewer. Tear the stack down when you are done
# demoing and redeploy in minutes.
#
# Uses the SAME remote S3 state as the deploy workflow (bucket benzene-ts-mesh-tfstate-<account>,
# key aws-lambda-mesh/terraform.tfstate), so it destroys exactly what that created. The state bucket
# itself is deliberately NOT deleted (it is tiny, versioned, and keeps a redeploy cheap); "Also delete
# the Terraform state bucket" opts into removing it too, for a full cleanup.
on:
  workflow_dispatch:
    inputs:
      region:
        description: "AWS region (must match the region the stack was deployed to)"
        required: true
        default: "eu-west-1"
      delete_state_bucket:
        description: "Also delete the Terraform state bucket (full cleanup; a redeploy then starts from scratch)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    # The AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY credentials live in the "test" GitHub Environment;
    # a job must declare the environment for its secrets to be exposed (matching the deploy workflow).
    # Without this both credential expressions render empty and every AWS step fails.
    environment: test
    steps:
      # No typed confirmation — this demo stack is not precious; run the workflow and it tears down.
      - uses: actions/checkout@v4

      # Terraform evaluates the WHOLE configuration to build a destroy plan, and each Lambda resource
      # calls filebase64sha256() on its bundle zip — so a destroy dies with "no such file or directory"
      # unless the zips exist locally. This job deliberately does not build them (tearing down needs no
      # code, and bundling seven functions just to delete them would be wasteful), so stand in empty
      # placeholders: only the hash expression has to evaluate, and a destroy uploads nothing. The
      # viewer page (../web/index.html, used by filemd5) is committed, so it needs no placeholder.
      - name: Create placeholder Lambda artifacts (so filebase64sha256() can evaluate)
        run: |
          mkdir -p examples/aws-lambda-mesh/artifacts
          for NAME in orders payments shipping inventory notifications analytics mesh; do
            ZIP="examples/aws-lambda-mesh/artifacts/$NAME.zip"
            [ -f "$ZIP" ] || : > "$ZIP"
          done
          ls -l examples/aws-lambda-mesh/artifacts

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # The access key ID is stored as a GitHub *variable* (vars.) and the secret access key as a
      # *secret* (secrets.) in the "test" Environment, so read the key ID from either place (var first,
      # falling back to a secret of the same name). Passed via env: rather than interpolated into the
      # script body — same shape as the deploy workflow.
      - name: Verify AWS credentials are available
        env:
          KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          [ -z "$KEY_ID" ] && { echo "::error::AWS_ACCESS_KEY_ID is empty (checked both vars and secrets)."; missing=1; }
          [ -z "$SECRET" ] && { echo "::error::AWS_SECRET_ACCESS_KEY is empty in this job."; missing=1; }
          if [ "$missing" = "1" ]; then
            echo "::error::In the 'test' GitHub Environment (Settings -> Environments -> test): set AWS_ACCESS_KEY_ID as a Variable (or Secret) and AWS_SECRET_ACCESS_KEY as a Secret, ensure the deployment-branch policy allows this branch, and that the names match exactly."
            exit 1
          fi
          echo "Both AWS credentials are present."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ vars.AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}

      # Point at the same remote state the deploy wrote. The committed main.tf carries no backend (so
      # local deploy.sh uses local state); the deploy drops in a backend.tf, so this destroy must too,
      # or `terraform init` would use empty local state and destroy nothing. If the state bucket is
      # missing there is nothing deployed (or it was deployed to another region) — say so plainly
      # rather than creating one.
      - name: Terraform init (remote S3 state)
        working-directory: examples/aws-lambda-mesh/deploy
        env:
          REGION: ${{ inputs.region }}
        run: |
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          STATE_BUCKET="benzene-ts-mesh-tfstate-${ACCOUNT}"
          echo "STATE_BUCKET=$STATE_BUCKET" >> "$GITHUB_ENV"
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "::error::No Terraform state bucket ($STATE_BUCKET) in $REGION — nothing to destroy here. Check the region matches the deploy."
            exit 1
          fi
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=aws-lambda-mesh/terraform.tfstate" \
            -backend-config="region=$REGION"

      # The artifacts bucket is declared force_destroy = true, so terraform destroy empties it (the
      # mesh-written catalog + the viewer page + anything else under it) before deleting it — no manual
      # emptying step is needed here, unlike the .NET stack whose bucket is not force_destroy.
      - name: Terraform destroy
        working-directory: examples/aws-lambda-mesh/deploy
        run: |
          terraform destroy -input=false -auto-approve -var "region=${{ inputs.region }}"

      # The CloudWatch log groups Lambda creates implicitly (/aws/lambda/<fn>) are not Terraform
      # resources, so destroy leaves them behind, still storing (and billing for) log data. Every
      # function is named benzene-ts-mesh-<svc>, so one prefix covers all seven.
      - name: Delete leftover Lambda log groups
        continue-on-error: true
        run: |
          for GROUP in $(aws logs describe-log-groups --log-group-name-prefix "/aws/lambda/benzene-ts-mesh" \
                          --query 'logGroups[].logGroupName' --output text); do
            echo "Deleting log group $GROUP"
            aws logs delete-log-group --log-group-name "$GROUP" || true
          done

      - name: Delete the Terraform state bucket
        if: ${{ inputs.delete_state_bucket }}
        continue-on-error: true
        run: |
          echo "Deleting state bucket $STATE_BUCKET (all versions)"
          aws s3api delete-objects --bucket "$STATE_BUCKET" --delete "$(aws s3api list-object-versions \
            --bucket "$STATE_BUCKET" --output json \
            --query '{Objects: [].{Key:Key,VersionId:VersionId}}' )" 2>/dev/null || true
          aws s3api delete-objects --bucket "$STATE_BUCKET" --delete "$(aws s3api list-object-versions \
            --bucket "$STATE_BUCKET" --output json \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' )" 2>/dev/null || true
          aws s3 rb "s3://$STATE_BUCKET" --force || true

      - name: Confirm teardown
        run: |
          echo "aws-lambda-mesh stack destroyed in ${{ inputs.region }}."
          echo "The CloudWatch/metric data already recorded is retained by AWS until its own retention expires;"
          echo "no further activity is produced now that the schedule and Lambdas are gone."
