name: Release

# Builds all 130 Benzene TypeScript packages to CommonJS and publishes them to npm. Fires on a
# version tag (e.g. `v0.1.0-beta.1`) and is also runnable on demand via the Actions tab. Publishes
# under the `beta` npm dist-tag, then points `latest` at the same version, so a plain
# `npm install @benzenejs/<pkg>` (no tag) installs this release. Pre-1.0 every version is a
# prerelease (`0.1.0-beta.N`), and the version string says so.
#
# Authentication (see docs/publishing.md):
#   * Trusted publishing (OIDC) is the primary path: each package registers this repository and
#     this workflow file as its trusted publisher (a maintainer runs scripts/trust-publishers.mjs
#     once), so with `id-token: write` npm publishes, and moves `latest`, without a stored secret.
#   * The `NPM_TOKEN` secret is optional. npm tries OIDC first and falls back to it, and it is
#     needed only for what OIDC cannot do: create a package that is not on npm yet. Without it, a
#     release that adds a package stops before publishing anything and names the new package.
#
# The publish step is RESUMABLE: it skips every package already on the registry at the current
# version and publishes the rest. A run that dies partway (npm rate-limits bulk publishing of new
# packages) is finished simply by re-running this workflow — which is the failure mode a plain
# `npm publish --workspaces` could not recover from, since it aborts on the first already-published
# package and leaves the remainder unpublished.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install
        run: npm ci
      - name: Verify versions are consistent (and match the tag, if tagged)
        run: node scripts/check-release-version.mjs
      - name: Build (CommonJS dist/ for every package)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Dry-run pack every package
        run: npm publish --workspaces --dry-run --access public

      # Names what this release would put on the registry, and fails only when the answer is
      # "nothing" — i.e. this version is already fully published and re-running can only 404.
      - name: Preflight — what is left to publish
        run: node scripts/check-not-already-published.mjs

  publish:
    name: Publish to npm
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing: npm exchanges this for a short-lived publish token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      # Not required: trusted publishing needs no secret. Said up front because without one, a
      # release that adds a package cannot publish it (the publish step names it and stops).
      - name: Say how this run authenticates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::No NPM_TOKEN secret: publishing through trusted publishing only, which cannot create a package that is not on npm yet. See docs/publishing.md."
          else
            echo "NPM_TOKEN is set: npm tries trusted publishing first and falls back to the token."
          fi

      - name: Install
        run: npm ci
      # Trusted publishing needs npm 11.5.1+, and moving a dist-tag over it a later one still.
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest
      - name: Build (CommonJS dist/ for every package)
        run: npm run build

      - name: Publish everything not already on the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-workspaces.mjs

      # npm sets `latest` only on a package's first publish, so a package that existed before this
      # release would keep installing its old version by default. Move `latest` to the version just
      # published, for every package; skips those already there and never moves it backwards.
      # To retry just this step, re-run this job: the publish finds nothing left and skips ahead.
      - name: Point latest at this release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/promote-latest.mjs
