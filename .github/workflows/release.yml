name: Release

# Builds all 129 Benzene TypeScript packages to CommonJS and publishes them to npm. Fires on a
# version tag (e.g. `v0.1.0-beta.1`) and is also runnable on demand via the Actions tab. Publishes
# under the `beta` npm dist-tag, so a plain `npm install @benzenejs/<pkg>` (no tag) never resolves
# to it.
#
# Authentication (see docs/publishing.md):
#   * The `NPM_TOKEN` repository secret — a granular access token with read AND write access to the
#     `@benzenejs` scope — is what actually authorises the publish. It is required, because npm has
#     no "pending publisher" concept: a package that does not exist on the registry yet CANNOT be
#     created by trusted publishing, only by a token.
#   * `id-token: write` is still granted, so for any package that HAS a Trusted Publisher registered
#     for this repository and this workflow file, npm uses OIDC and the token is never exercised.
#     Registering trusted publishers (npmjs.com -> package -> Settings -> Trusted Publisher:
#     organization `daniellepelley`, repository `benzene-typescript`, workflow `release.yml`) is
#     therefore an optional hardening step, done per package, once the package exists.
#
# The publish step is RESUMABLE: it skips every package already on the registry at the current
# version and publishes the rest. A run that dies partway (npm rate-limits bulk publishing of new
# packages) is finished simply by re-running this workflow — which is the failure mode a plain
# `npm publish --workspaces` could not recover from, since it aborts on the first already-published
# package and leaves the remainder unpublished.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install
        run: npm ci
      - name: Verify versions are consistent (and match the tag, if tagged)
        run: node scripts/check-release-version.mjs
      - name: Build (CommonJS dist/ for every package)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Dry-run pack every package
        run: npm publish --workspaces --dry-run --access public

      # Names what this release would put on the registry, and fails only when the answer is
      # "nothing" — i.e. this version is already fully published and re-running can only 404.
      - name: Preflight — what is left to publish
        run: node scripts/check-not-already-published.mjs

  publish:
    name: Publish to npm
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets trusted publishing take over for packages that have it registered
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"

      # Without this, setup-node leaves NODE_AUTH_TOKEN at its literal placeholder
      # (XXXXX-XXXXX-XXXXX-XXXXX) and every publish fails with a 404 that reads like a missing
      # scope rather than a missing credential. Fail here instead, where the cause is legible.
      - name: Check the publish credential is present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Create a granular access token on npmjs.com with read and write access to the @benzenejs scope, add it as the NPM_TOKEN secret, and re-run. See docs/publishing.md."
            exit 1
          fi

      - name: Install
        run: npm ci
      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest
      - name: Build (CommonJS dist/ for every package)
        run: npm run build

      - name: Publish everything not already on the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-workspaces.mjs
